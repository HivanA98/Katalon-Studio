name: Katalon mobile (reusable)

# Boots an Android emulator, installs Appium 3 and Katalon Runtime Engine,
# then runs one mobile test suite. Called from katalon-ci.yml.
on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      slug:
        type: string
        required: true
      project:
        description: Path of the .prj file
        type: string
        required: true
      suite:
        type: string
        required: true
      experimental:
        description: Do not fail the workflow when this suite fails
        type: boolean
        default: false

env:
  KATALON_VERSION: "11.5.0"
  ANDROID_API_LEVEL: "33"

jobs:
  android:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ inputs.experimental }}
    steps:
      - uses: actions/checkout@v7

      - name: Check Katalon API key
        id: licence
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        run: |
          if [ -z "$KATALON_API_KEY" ]; then
            echo "::warning title=Katalon skipped::Add a KATALON_API_KEY repository secret to execute the suites (see README)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable KVM for the emulator
        if: steps.licence.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v7
        if: steps.licence.outputs.available == 'true'
        with:
          node-version: "22"

      - name: Install Appium 3 + UiAutomator2
        if: steps.licence.outputs.available == 'true'
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          # Katalon Runtime Engine looks for Appium in /usr/local/lib/node_modules/appium on Linux
          sudo mkdir -p /usr/local/lib/node_modules
          sudo ln -sfn "$(npm root -g)/appium" /usr/local/lib/node_modules/appium

      - name: Cache Katalon Runtime Engine
        if: steps.licence.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: ~/kre
          key: kre-${{ env.KATALON_VERSION }}-linux

      - name: Download Katalon Runtime Engine
        if: steps.licence.outputs.available == 'true'
        run: |
          if [ ! -d ~/kre ] || [ -z "$(ls -A ~/kre)" ]; then
            mkdir -p ~/kre
            curl -sSfL "https://download.katalon.com/${KATALON_VERSION}/Katalon_Studio_Engine_Linux_64-${KATALON_VERSION}.tar.gz" \
              | tar -xz -C ~/kre
          fi

      - name: Run ${{ inputs.suite }} on Android ${{ env.ANDROID_API_LEVEL }}
        if: steps.licence.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
          PROJECT: ${{ github.workspace }}/${{ inputs.project }}
          SUITE: ${{ inputs.suite }}
          REPORT_DIR: ${{ github.workspace }}/katalon-reports/${{ inputs.slug }}
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/run-katalon-mobile.sh "$PROJECT" "$SUITE" "$REPORT_DIR"

      - name: Publish test results
        if: always() && steps.licence.outputs.available == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: katalon-reports/${{ inputs.slug }}/**/JUnit_Report.xml
          check_name: Katalon · ${{ inputs.name }}
          include_passed: true
          detailed_summary: true

      - name: Upload Katalon report
        if: always() && steps.licence.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: katalon-report-${{ inputs.slug }}
          path: katalon-reports/${{ inputs.slug }}
          if-no-files-found: warn
          retention-days: 14
